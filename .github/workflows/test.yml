name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build pytest
      - run: python -m pytest
      - run: python -m build
      - run: python -m venv .smoke-venv
      - run: .smoke-venv/bin/pip install dist/*.whl
      - run: .smoke-venv/bin/python -c 'import metis_sdk; print(metis_sdk.__all__)'
      - run: git diff --check
